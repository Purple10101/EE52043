# Drop points on the real rig: the eight slots of its two trays, scene frame mm (workspace.toml
# [scene_to_robot] takes them to the robot frame). bins.toml (kept out of git with the digital twin)
# is the CAD layout, which the twin models; the trays on the rig were turned on 2026-11-02, so the real
# arm uses this file.
#
# Measured 2026-11-12 (logs/bin_teach_20261112.json): with the servo supply off, the user held the centre
# between the open jaws (the shaft's axis) over each slot's centre, and the potentiometers were read
# (median of 50) and turned into scene mm by the CAD rig, as resistor_nav.to_bin turns them back. Each
# slot is as taught, not fitted to a row. The 2026-11-02 points (logs/bins_real_replaced_20261112_184555.toml)
# were 1-13 mm off, up to 6 mm across a slot, after a new gripper, new firmware and moving the rig.
# long_axis_deg, the slots' long sides (scene, from +x toward +y), is still the 2026-11-02 rows' normal.
# Names as on the rig: A1 is the slot furthest from the camera tower, on to B4 beside it.
#
# With the camera tower mounted, B4's centre is inside its keep-out zone (keep_out/camera_tower.json, from
# the CAD, gripper v4); along the slot, away from the tower, it is clear from 8 mm: drop_along_mm moves the
# drop point along the slot from its centre. Heights and slot size are the CAD's (bins.toml), not measured.

slot_floor_z_mm = -47.0
slot_rim_z_mm = -40.0
drop_above_rim_mm = 8.0           # fingertips this far above the rim when the jaws open (or the slide's lowest)
slot_size_mm = [66.0, 16.0]

bins = [
    { id = "A1", centre_mm = [-87.5, 22.6], long_axis_deg = -79.6 },     # base 52.10, elbow 134.31
    { id = "A2", centre_mm = [-115.8, 29.3], long_axis_deg = -79.6 },    # base 55.97, elbow 117.01
    { id = "A3", centre_mm = [-140.7, 22.1], long_axis_deg = -79.6 },    # base 55.63, elbow 102.31
    { id = "A4", centre_mm = [-165.5, 22.3], long_axis_deg = -79.6 },    # base 61.04, elbow 84.83
    { id = "B1", centre_mm = [-132.1, -41.5], long_axis_deg = 10.9 },    # base 28.30, elbow 104.95
    { id = "B2", centre_mm = [-120.8, -69.7], long_axis_deg = 10.9 },    # base 16.01, elbow 104.29
    { id = "B3", centre_mm = [-118.5, -90.1], long_axis_deg = 10.9 },    # base 11.07, elbow 97.97
    { id = "B4", centre_mm = [-114.8, -113.9], long_axis_deg = 10.9, drop_along_mm = 12.0 },   # base 7.06, elbow 88.78
]
