# The overhead camera's detector. Camera settings, plate model, work area and tiles come from the
# robot_offline repo's configs/ (installed with pip install -e), so training and the robot match.

weights = "models/seg_grey_v2/best.pt"   # relative paths are in the robot_offline repo
conf = 0.5                # below about 0.3 the plate's rim shows up as false bodies

# The band reader's value is trusted at this confidence or more; under it the part stays on the plate as
# "unsure". The sorting run's own setting: robot_offline's tools keep theirs (configs/band_reader.toml
# [deploy], provisionally 0.7). 0.9 chosen by the user on 2026-11-11 from a 9-look test of 8 known parts:
# 0.7 let a 4k7 through as 470R, nothing wrong passed from 0.85 up, and the highest wrong reading was 0.82
# (EE52043 experiments/2026-11-11_full_run_8, section 6, kept on the lab PC).
min_confidence = 0.9
